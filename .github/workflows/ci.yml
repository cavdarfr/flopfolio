name: CI

on:
    pull_request:
    push:
        branches: [main, staging]

jobs:
    quality:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - name: Enable pnpm
              run: corepack enable
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Unit and Convex tests
              run: pnpm test
            - name: Lint
              run: pnpm lint
            - name: Typecheck
              run: pnpm typecheck
            - name: Production build
              run: pnpm build
